services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bloquinho
      POSTGRES_USER: bloquinho
      POSTGRES_PASSWORD: bloquinho
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloquinho -d bloquinho"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
