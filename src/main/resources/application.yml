spring:
  application:
    name: bloquinho-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bloquinho}
    username: ${DB_USERNAME:bloquinho}
    password: ${DB_PASSWORD:bloquinho}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management.endpoints.web.exposure.include: health
app.cors:
  admin-origin: ${ADMIN_FRONTEND_URL:http://localhost:4200}
  public-origin: ${PUBLIC_FRONTEND_URL:http://localhost:4300}
